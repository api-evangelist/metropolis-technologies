name: Metropolis Technologies
description: >-
  Metropolis Technologies is an AI-powered recognition platform that uses computer
  vision to make real-world physical spaces responsive, best known as the largest
  U.S. parking operator with checkout-free parking across 4,200+ North American
  locations. Founded in 2017, the company powers what it calls the "Recognition
  Economy" — vehicles are recognized on entry and exit so members pay automatically
  without tickets, gates, or lines. Metropolis scaled through the acquisitions of
  Premier Parking (2022) and SP Plus Corporation (2024), raised $1.6 billion in
  financing in 2025, and was named a TIME100 Most Influential Company of 2026. It
  is backed by Dragoneer. No public developer API, OpenAPI specification, or SDK
  surface has been identified; this profile captures the company's public identity
  and security/compliance posture.
